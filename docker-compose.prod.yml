version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: gigflow-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/gigflow_prod
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gigflow
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: gigflow-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - gigflow
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mongodb:
    image: mongo:7-alpine
    container_name: gigflow-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=gigflow_prod
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me}
    volumes:
      - mongodb_data:/data/db
    networks:
      - gigflow
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  gigflow:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
